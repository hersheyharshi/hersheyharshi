<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 1288 270" width="1288" height="270"><rect x="0" y="40" width="224" height="150" rx="18" fill="#ffffff0b" stroke="#4de0c0" stroke-opacity=".6"/><circle cx="30" cy="40" r="0"/><text x="20" y="82" font-size="17" font-weight="800" fill="#4de0c0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">1. Local training</text><text x="20" y="118" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">each hospital trains on its</text><text x="20" y="138" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">own patients only</text><line x1="230" y1="115" x2="258" y2="115" stroke="#ffffff55" stroke-width="2"/><path d="M251,109 L258,115 L251,121" fill="none" stroke="#ffffff88" stroke-width="2"/><circle r="4" fill="#ffb454"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M230,115 L258,115"/></circle><rect x="264" y="40" width="224" height="150" rx="18" fill="#ffffff0b" stroke="#ffb454" stroke-opacity=".6"/><circle cx="294" cy="40" r="0"/><text x="284" y="82" font-size="17" font-weight="800" fill="#ffb454" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">2. Clip and add noise</text><text x="284" y="118" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">limit any one patient's pull,</text><text x="284" y="138" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">add measured noise (DP)</text><line x1="494" y1="115" x2="522" y2="115" stroke="#ffffff55" stroke-width="2"/><path d="M515,109 L522,115 L515,121" fill="none" stroke="#ffffff88" stroke-width="2"/><circle r="4" fill="#ffb454"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M494,115 L522,115"/></circle><rect x="528" y="40" width="224" height="150" rx="18" fill="#ffffff0b" stroke="#8b6cff" stroke-opacity=".6"/><circle cx="558" cy="40" r="0"/><text x="548" y="82" font-size="17" font-weight="800" fill="#8b6cff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">3. Send weights</text><text x="548" y="118" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">only model weights leave,</text><text x="548" y="138" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">never patient records</text><line x1="758" y1="115" x2="786" y2="115" stroke="#ffffff55" stroke-width="2"/><path d="M779,109 L786,115 L779,121" fill="none" stroke="#ffffff88" stroke-width="2"/><circle r="4" fill="#ffb454"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M758,115 L786,115"/></circle><rect x="792" y="40" width="224" height="150" rx="18" fill="#ffffff0b" stroke="#ff5fa2" stroke-opacity=".6"/><circle cx="822" cy="40" r="0"/><text x="812" y="82" font-size="17" font-weight="800" fill="#ff5fa2" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">4. Average</text><text x="812" y="118" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">server blends them, weighted</text><text x="812" y="138" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">by patients; repeat 20 rounds</text><line x1="1022" y1="115" x2="1050" y2="115" stroke="#ffffff55" stroke-width="2"/><path d="M1043,109 L1050,115 L1043,121" fill="none" stroke="#ffffff88" stroke-width="2"/><circle r="4" fill="#ffb454"><animateMotion dur="1.6s" begin="1.2000000000000002s" repeatCount="indefinite" path="M1022,115 L1050,115"/></circle><rect x="1056" y="40" width="224" height="150" rx="18" fill="#ffffff0b" stroke="#4de0c0" stroke-opacity=".6"/><circle cx="1086" cy="40" r="0"/><text x="1076" y="82" font-size="17" font-weight="800" fill="#4de0c0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">5. Shared model</text><text x="1076" y="118" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">one model and one agreed</text><text x="1076" y="138" font-size="13.5" fill="#f4eeff" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">feature store for all four</text><path d="M1168.0,196 C1168.0,240 112.0,240 112.0,196" fill="none" stroke="#ffffff33" stroke-dasharray="5 5" stroke-width="2"/><text x="640" y="252" text-anchor="middle" font-size="13" fill="#b9a9e0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">the shared model goes back to every hospital for the next round</text></svg>